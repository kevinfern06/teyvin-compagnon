# Ponctuel (à supprimer après passage) : teyvin.9 et teyvin.8 passent avant teyvin.14 dans la liste publique
# des releases (GitHub trie par jour puis par nom de tag en texte), et les compagnons d'avant teyvin.12 prennent
# la première de la liste : ceux en teyvin.9 ne voyaient pas la mise à jour. On les repasse en brouillon
# (réversible, les tags restent) pour que la plus récente soit en tête.
name: Ordre des releases

on:
  push:
    branches: [main]
    paths: [".github/workflows/ordre-releases.yml"]

permissions:
  contents: write

jobs:
  brouillons:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v0.2.2-teyvin.9 v0.2.2-teyvin.8; do
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=true
          done
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5" --jq '.[] | "\(.tag_name) brouillon=\(.draft)"'
